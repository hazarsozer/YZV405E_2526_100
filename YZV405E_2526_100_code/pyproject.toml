[project]
name = "nlp-project"
version = "0.1.0"
description = "AdMIRe 2.0 Subtask 1 - YZV405E Term Project"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
    "accelerate",
    "scikit-learn",
    "pandas",
    "numpy",
    "datasets",
    "pillow",
    "pytest",
    "pytest-cov",
    "joblib",
    "bitsandbytes",
    "sentencepiece",
    "protobuf",
    "pyarrow",
]

[tool.pytest.ini_options]
markers = [
    "unit: fast, no I/O beyond fixtures",
    "integration: touches real files or network",
]

[tool.uv]
# On macOS (dev machine) torch installs from PyPI with MPS support.
# On Linux (GPU training machine) switch to the CUDA index manually:
#   uv add torch --index pytorch-cu121 (or edit sources below and uncomment)

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
